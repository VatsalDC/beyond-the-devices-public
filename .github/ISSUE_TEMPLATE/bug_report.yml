name: "🐛 Bug report"
description: "Something is broken. Help us reproduce it."
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. The more platform detail you include
        up front, the faster we can reproduce it.

        If you have a question instead, use
        [Discussions](https://github.com/VatsalDC/beyond-the-devices-public/discussions).
  - type: dropdown
    id: platform
    attributes:
      label: "Which side is affected?"
      description: "Pick the platform where you see the problem."
      options:
        - "macOS app"
        - "Android app"
        - "Both"
        - "Website / download"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: "macOS version"
      description: " Apple menu → About This Mac (e.g. macOS 15.2 Sequoia). Write N/A if the Mac side is not involved."
      placeholder: "e.g. macOS 15.2 (24C101)"
  - type: input
    id: android-version
    attributes:
      label: "Android version"
      description: "Settings → About phone (e.g. Android 15). Write N/A if the phone side is not involved."
      placeholder: "e.g. Android 15"
  - type: input
    id: mac-app-version
    attributes:
      label: "Mac app version"
      description: "Beyond the Devices → Settings, or the download page badge (e.g. 1.3.0)."
      placeholder: "e.g. 1.3.0"
  - type: input
    id: android-app-version
    attributes:
      label: "Android app version"
      description: "App info screen or the Play Store listing (e.g. 1.3.2)."
      placeholder: "e.g. 1.3.2"
  - type: input
    id: hardware
    attributes:
      label: "Hardware (optional)"
      description: "Mac model and phone model, if you think it matters."
      placeholder: "e.g. MacBook Air M2, Pixel 8"
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Numbered steps. Start from a fresh launch of both apps when you can."
      placeholder: |
        1. Open the Mac app.
        2. On the phone, choose Pair with Mac and scan the code.
        3. Click Approve on the Mac.
        4. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "What happened instead?"
      description: "Include the exact error text the app shows, if any."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs (optional)"
      description: |
        Mac: Console.app → filter "BeyondTheDevices" → copy the relevant lines.
        Android: enable Developer options → error details, or `adb logcat` if you use it.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots (optional)"
      description: "Drag and drop images here. Redact anything personal first."
  - type: textarea
    id: context
    attributes:
      label: "Anything else?"
      description: "Network type (home Wi-Fi, guest network, VPN active?), how long the pairing has worked, anything that changed recently."
